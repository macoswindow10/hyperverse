services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hyperverse
      POSTGRES_PASSWORD: hyperverse_password
      POSTGRES_DB: hyperverse_cloud
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hyperverse -d hyperverse_cloud"]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    env_file:
      - backend/.env
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
  agent:
    build:
      context: .
      dockerfile: docker/Dockerfile.agent
    env_file:
      - agent/.env
    ports:
      - "4100:4100"
    depends_on:
      - backend
volumes:
  postgres_data:
  redis_data:
